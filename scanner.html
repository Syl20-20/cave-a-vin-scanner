<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Scanner - Cave à Vin</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  body {
    margin: 0; padding: 16px; font-family: -apple-system, sans-serif;
    background: #f5f5f4; color: #292524;
  }
  h1 { font-size: 1.1rem; margin-bottom: 12px; }
  #reader { width: 100%; border-radius: 12px; overflow: hidden; background: #000; min-height: 280px; cursor: pointer; }
  button {
    width: 100%; padding: 14px; margin-top: 12px; border: none; border-radius: 12px;
    font-size: 1rem; font-weight: 600; background: #7c2d3e; color: white;
  }
  #status { margin-top: 10px; font-size: 0.9rem; color: #78716c; text-align: center; }
  input {
    width: 100%; box-sizing: border-box; padding: 10px; margin-top: 10px;
    border: 1px solid #d6d3d1; border-radius: 12px; font-size: 1rem;
  }
</style>
</head>
<body>
  <h1>🍷 Scanner un code-barres</h1>
  <div id="reader"></div>
  <button id="btnStart">📷 Démarrer le scan</button>
  <p style="font-size:0.85rem; color:#78716c; text-align:center; margin:4px 0 0;">
    Une fois la caméra activée, visez simplement le code-barres — pas besoin de re-cliquer.
  </p>
  <input id="manualCode" type="text" inputmode="numeric" placeholder="Ou saisir le code-barres manuellement">
  <button id="btnManual" style="background:#292524;">Envoyer ce code</button>
  <p id="status"></p>

<script>
  // ⚠️ REMPLACEZ cette URL par l'URL de VOTRE déploiement Apps Script (celle qui finit par /exec)
  const APPS_SCRIPT_URL = 'COLLEZ_ICI_URL_DE_VOTRE_APP/exec';

  let html5QrCode = null;
  let currentVideoTrack = null;
  const statusEl = document.getElementById('status');

  // ---------- MISE AU POINT TACTILE ----------
  // Permet de taper sur l'image caméra pour forcer une nouvelle mise au point à cet endroit
  document.getElementById('reader').addEventListener('click', (e) => {
    if (!currentVideoTrack) return;
    const capabilities = currentVideoTrack.getCapabilities ? currentVideoTrack.getCapabilities() : {};
    if (!capabilities.focusMode || !capabilities.focusMode.includes('manual')) {
      // Le téléphone ne permet pas de piloter le focus manuellement depuis le web :
      // on retente simplement un focus automatique complet en dernier recours.
      if (capabilities.focusMode && capabilities.focusMode.includes('single-shot')) {
        currentVideoTrack.applyConstraints({ advanced: [{ focusMode: 'single-shot' }] }).catch(() => {});
      }
      statusEl.textContent = 'Mise au point automatique relancée...';
      return;
    }
    const rect = e.currentTarget.getBoundingClientRect();
    const x = (e.clientX - rect.left) / rect.width;
    const y = (e.clientY - rect.top) / rect.height;
    currentVideoTrack.applyConstraints({
      advanced: [{ focusMode: 'manual', pointsOfInterest: [{ x: x, y: y }] }]
    }).then(() => {
      statusEl.textContent = 'Mise au point ajustée. Visez le code-barres...';
    }).catch(() => {
      statusEl.textContent = 'Impossible de régler la mise au point sur cet appareil.';
    });
  });

  document.getElementById('btnStart').addEventListener('click', () => {
    const btn = document.getElementById('btnStart');
    if (btn.disabled) return; // empêche un second clic pendant que le scan tourne déjà
    btn.disabled = true;
    btn.textContent = '📷 Scan en cours...';
    statusEl.textContent = 'Initialisation de la caméra...';
    html5QrCode = new Html5Qrcode("reader");
    Html5Qrcode.getCameras().then(cameras => {
      if (!cameras || cameras.length === 0) {
        statusEl.textContent = 'Aucune caméra détectée.';
        btn.disabled = false;
        btn.textContent = '📷 Démarrer le scan';
        return;
      }
      const backCam = cameras.find(c => /back|rear|environment/i.test(c.label)) || cameras[cameras.length - 1];
      html5QrCode.start(
        backCam.id,
        {
          fps: 15,
          qrbox: { width: 300, height: 120 },
          aspectRatio: 1.777,
          disableFlip: false,
          formatsToSupport: [
            Html5QrcodeSupportedFormats.EAN_13,
            Html5QrcodeSupportedFormats.EAN_8,
            Html5QrcodeSupportedFormats.UPC_A,
            Html5QrcodeSupportedFormats.UPC_E,
            Html5QrcodeSupportedFormats.CODE_128
          ],
          experimentalFeatures: {
            useBarCodeDetectorIfSupported: true
          }
        },
        (decodedText) => {
          clearTimeout(window._scanTimeout);
          statusEl.textContent = 'Code détecté : ' + decodedText;
          html5QrCode.stop().then(() => redirectWithBarcode(decodedText));
        },
        () => {}
      ).then(() => {
        statusEl.textContent = 'Visez le code-barres... (touchez l\'image pour ajuster la mise au point)';
        // Récupère la piste vidéo active pour permettre la mise au point tactile
        setTimeout(() => {
          const videoEl = document.querySelector('#reader video');
          if (videoEl && videoEl.srcObject) {
            const tracks = videoEl.srcObject.getVideoTracks();
            if (tracks && tracks.length > 0) currentVideoTrack = tracks[0];
          }
        }, 500);
        // Filet de sécurité : si rien n'est détecté après 25s, on réactive le bouton
        window._scanTimeout = setTimeout(() => {
          if (html5QrCode) {
            statusEl.textContent = 'Aucun code détecté. Réessayez ou utilisez la saisie manuelle ci-dessous.';
            btn.disabled = false;
            btn.textContent = '📷 Démarrer le scan';
          }
        }, 25000);
      }).catch(err => {
        statusEl.textContent = "Erreur d'accès caméra : " + err;
        btn.disabled = false;
        btn.textContent = '📷 Démarrer le scan';
      });
    }).catch(err => {
      statusEl.textContent = 'Permission caméra refusée ou indisponible : ' + err;
      btn.disabled = false;
      btn.textContent = '📷 Démarrer le scan';
    });
  });

  document.getElementById('btnManual').addEventListener('click', () => {
    const code = document.getElementById('manualCode').value.trim();
    if (code) redirectWithBarcode(code);
  });

  function redirectWithBarcode(barcode) {
    statusEl.textContent = 'Retour vers l\'application...';
    window.location.href = APPS_SCRIPT_URL + '?barcode=' + encodeURIComponent(barcode);
  }
</script>
</body>
</html>
